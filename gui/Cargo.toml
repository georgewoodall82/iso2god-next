[package]
name = "iso2god-next-gui"
version = "1.8.0"
edition = "2024"
description = "A GTK4/libadwaita frontend for iso2god-next"
license = "MIT"
publish = false

[dependencies]
anyhow = { version = "1.0.97", features = ["backtrace"] }
iso2god-next = { path = ".." }
relm4 = { version = "0.9.1", features = ["libadwaita", "gnome_46"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
suppaftp = { version = "12.2.1", default-features = false }
